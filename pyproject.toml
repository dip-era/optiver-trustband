[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trustband"
version = "0.1.0"
description = "Trust-aware adaptive conformal prediction bands for fusing manipulable text with market data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "mapie",
    "matplotlib",
    "transformers",
    "torch",
    "pyyaml",
]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
